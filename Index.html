<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Rajni 💖</title>

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Arial;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

.card{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:30px;
  width:320px;
  text-align:center;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{ color:#ff4d6d; }

button{
  padding:10px 18px;
  margin:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

#yes{ background:#ff4d6d; color:white; }

#no{ background:#ccc; position:absolute; }

#hug{
  display:none;
  color:#ff4d6d;
  font-size:18px;
  margin-top:10px;
}

#hugImg{
  display:none;
  width:220px;
  border-radius:15px;
  margin-top:10px;
  border:3px solid #ff4d6d;
}

.heart{
  position:absolute;
  color:white;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh);opacity:1;}
  to{transform:translateY(-10vh);opacity:0;}
}

.glow{
  box-shadow:0 0 30px #ff4d6d !important;
}

@keyframes floatUp{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-600px);opacity:0;}
}
</style>
</head>

<body>

<div class="card">
  <h1>Hey Rajni 💖</h1>
  <p>You are my happiness ✨<br>Will you be mine?</p>

  <button id="yes">Yes 💕</button>
  <button id="no">No 😅</button>

  <div id="hug">🤗 Sending you a warm hug 💖</div>
  <img id="hugImg" alt="hug image" />
</div>

<script>

// floating hearts
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},300);

// NO button runs away
const noBtn=document.getElementById("no");
noBtn.addEventListener("mouseover",()=>{
  noBtn.style.left=Math.random()*80+"vw";
  noBtn.style.top=Math.random()*80+"vh";
});

const hugImages = [
  "https://cdn.pixabay.com/photo/2017/08/06/00/27/couple-2583442_1280.jpg
